/* ---------- deployment: place your units on your own two back rows ---------- */
const DEPLOY_SECONDS=60;
let DEP=null;
// screen cell (r: 0 = front row, 1 = back row; c: 0-9 left to right as the player sees the board) -> board cell
const depCell=(team,r,c)=>team===0?{x:c,y:r===0?8:9}:{x:9-c,y:r===0?1:0};
function randomLayout(keys,team){
  const cells=[];for(let r=0;r<2;r++)for(let c=0;c<10;c++)cells.push(depCell(team,r,c));
  for(let i=cells.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cells[i],cells[j]]=[cells[j],cells[i]]}
  return keys.map((k,i)=>({k,x:cells[i].x,y:cells[i].y}));
}
function stopDeploy(){if(DEP&&DEP.timer)clearInterval(DEP.timer);DEP=null}
function depAtCell(r,c){return DEP.place.findIndex(p=>p&&p.r===r&&p.c===c)}
function depFill(){
  const free=[];for(let r=0;r<2;r++)for(let c=0;c<10;c++)if(depAtCell(r,c)<0)free.push({r,c});
  for(let i=free.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[free[i],free[j]]=[free[j],free[i]]}
  DEP.place.forEach((p,i)=>{if(!p)DEP.place[i]=free.pop()});

function depSubmit(){

function depLeft(){return Math.max(0,Math.ceil((DEP.deadline-Date.now())/1000))}
function depDraw(){
  const D=DEP,left=depLeft(),placed=D.place.filter(Boolean).length,all=placed===D.picks.length;

  }

  <div class="row2"><button class="m" id="depRnd" ${D.submitted||all?"disabled":""}>สุ่มที่เหลือ</button><button class="m" id="depGo" ${D.submitted||!all?"disabled":""} style="padding:8px 20px;font-size:15px">${D.submitted?"รออีกฝ่าย":"ยืนยันการวาง"}</button></div>
  ${D.err?`<div class="mu" style="color:#ff8a94">${D.err}</div>`:""}`;

function deployStart(picks,team,seconds,onSubmit){

/* ---------- rules ---------- */
function loseHP(t,d){
  const a=Math.min(t.sh,d);t.sh-=a;t.hp-=d-a;
  num(t,"-"+d,"#ff5a66");
  if(d>0&&t.ww>0)exitWW(t);
  if(t.hp<=0){U=U.filter(x=>x!==t);VX=VX.filter(v=>v.owner!==t.id);if(t.k==="nimbora")CZ.rz=CZ.rz.filter(z=>z.team!==t.team);if(sel===t.id)sel=null;if(!U.some(x=>x.team===t.team))over=1-t.team}
}
// the Tide Shield cooldown only starts once the silence it caused is gone (it ends by time or is cured)
function endSilence(u){const g=R[u.k].s.findIndex(x=>x.k==="g");if(g>=0)u.cd[g]=R[u.k].s[g].cd}
function heal(t,a,cure){
  // Curse of Master: healing is allowed but reduced (rounded, at least 1); curing Bleeding/Poison still works
  if(R[t.k].healMul)a=Math.max(1,Math.round(a*R[t.k].healMul));
  t.hp=Math.min(R[t.k].hp,t.hp+a);num(t,"+"+a,"#43c07a");
  if(cure){t.st.bleed=0;t.st.poison=0;if(t.st.silent>0){t.st.silent=0;endSilence(t)}}
}
function hurt(src,t,s,d){
  if(!canHit(s,t)){
    if(U.includes(t)&&t.st.freeze<1&&isRanged(s)&&R[t.k].rangedGroundImmune&&!(t.fly>0))msg=R[t.k].n+" อยู่บนพื้น โดนระยะไกลไม่ได้";
    return false;
  }
  const rule=(R[t.k].blk||[]).find(b=>b.c.includes(s.c)&&b.l.includes(s.l)&&(!b.tg||b.tg===s.tg)&&Math.random()<b.p);
  if(rule){addFx({type:"block",x:t.x,y:t.y});msg=R[t.k].n+" กันการโจมตีได้!";return false}
  // damage modifiers multiply: kingdom sword vs dragon/spirit/legend, ranged vs a flying dragon, element resistance
  let m=1;const T=R[t.k],beast=isBeast(t);
  // Beast Hunter: fixed damage against dragons/monsters, then Awakening adds +1 (+3 against beasts) before the multipliers
  if(beast&&s.bd!==undefined)d=s.bd;
  if(src.awk>0&&s.d)d+=beast?3:1;
  // takes more from ranged skills, except when the attacker is itself a dragon/monster
  if(T.rngIn&&isRanged(s)&&!isBeast(src))m*=T.rngIn;
  // Awakening: only 10% of the damage dealt by dragons/monsters
  if(t.awk>0&&isBeast(src))m*=.1;
  if(T.mulRanged&&isRanged(s))m*=T.mulRanged;
  if(T.mulMelee&&hasT(s,"melee"))m*=T.mulMelee;
  if(hasT(s,"kingdom")&&unitTags(t).some(g=>["dragon","spirit","legend"].includes(g)))m*=1.5;
  if(isRanged(s)&&T.flyRangedMul&&t.fly>0)m*=T.flyRangedMul;
  if(T.res)(s.tags||[]).forEach(g=>{if(T.res[g]!==undefined)m*=T.res[g]});
  d=Math.max(0,Math.round(d*m));
  msg=R[src.k].n+" ใช้ "+s.n+" ใส่ "+R[t.k].n+" -"+d;
  loseHP(t,d);
  return true;
}
function exitWW(u){
  u.ww=0;
  const w=R[u.k].s.findIndex(x=>x.k==="w");if(w>=0)u.cd[w]=R[u.k].s[w].cd;
  if(u.tpUsed){const m=R[u.k].s.findIndex(x=>x.k==="m");if(m>=0)u.cd[m]=1}
  u.tpUsed=false;addFx({type:"smoke",x:u.x,y:u.y,sz:.8});
}
function land(u){
  u.fly=0;
  const f=R[u.k].s.findIndex(x=>x.k==="f");if(f>=0)u.cd[f]=R[u.k].s[f].cd;
  addFx({type:"swirl",x:u.x,y:u.y,dur:1000});
}
function tick(u,s){
  addFx({type:"aura",x:u.x,y:u.y});
  FXLAG=320;
  U.filter(e=>e.team!==u.team&&dist(u,e)===1).forEach(e=>{if(over<0){addFx({type:"hit",v:"fire",x:e.x,y:e.y,dl:300});hurt(u,e,s,s.d)}});
  FXLAG=0;
}
function begin(t){
  turn=t;sel=null;mode=-1;P[t]={mp:2,ap:2};
  U.filter(u=>u.team===t).forEach(u=>{
    if(!U.includes(u)||over>=0)return;
    u.cd=u.cd.map(c=>Math.max(0,c-1));
    u.stunned=u.st.stun>0;u.st.stun=0;
    if(u.st.silent>0){u.st.silent--;if(u.st.silent===0)endSilence(u)}
    if(u.st.regen){addFx({type:"tick",v:"regen",x:u.x,y:u.y});heal(u,u.st.regen.amt);u.st.regen.left--;if(u.st.regen.left<=0)u.st.regen=null}
    if(u.st.bleed>0&&U.includes(u)){addFx({type:"tick",v:"bleed",x:u.x,y:u.y});loseHP(u,2);u.st.bleed--}
    if(u.st.poison&&U.includes(u)){addFx({type:"tick",v:"poison",x:u.x,y:u.y});loseHP(u,u.st.poison)}
    if(u.st.burn&&U.includes(u)){addFx({type:"tick",v:"burn",x:u.x,y:u.y});loseHP(u,2*u.st.burn);u.st.burn--}
    if(!U.includes(u)||over>=0)return;
    if(u.aura>0){u.aura--;tick(u,R[u.k].s.find(x=>x.k==="s"))}
    if(u.ww>0){u.ww--;if(u.ww===0)exitWW(u)}
    if(U.includes(u)&&over<0)VX.filter(v=>v.owner===u.id).forEach(pullVortex);
    if(!U.includes(u)||over>=0)return;
    if(u.awk>0){u.awk--;if(u.awk===0){const v=R[u.k].s.findIndex(x=>x.k==="v");if(v>=0)u.cd[v]=R[u.k].s[v].cd;addFx({type:"smoke",x:u.x,y:u.y,sz:.7})}}
    if(u.k==="nimbora"){
      u.zs=0;
      if(u.sz>0){u.sz--;if(u.sz===0){const xi=R[u.k].s.findIndex(q=>q.k==="x");if(xi>=0)u.cd[xi]=R[u.k].s[xi].cd;addFx({type:"smoke",x:u.x,y:u.y,sz:1.1})}}
      if(over<0)rain(u);
    }
    if(!U.includes(u)||over>=0)return;
    if(R[u.k].pf)u.fly=1;else if(u.fly>0){u.fly--;if(u.fly===0)land(u)}
  });
  render();
  if(onlineGame){broadcastGameState();}
  else if(t===1&&over<0)setTimeout(bot,600);
}
function usable(u,si){
  const s=eff(u,si),p=P[u.team];
  if(turn!==u.team||over>=0||u.cd[si]>0||dis(u)||u.st.silent>0)return false;
  if(s.k==="m"?p.mp<1:p.ap<(s.cost!==undefined?s.cost:1))return false;
  if(s.k==="w"&&u.ww>0)return false;
  if(s.k==="v"&&u.awk>0)return false;
  if(s.k==="x"&&u.sz>0)return false;
  if(s.k==="z"&&(u.zs||0)>=3)return false;
  if(s.k==="c"&&!cellsFor(u,s).length)return false;

    cells+=`<div class="cell ${(vx+vy)%2?"k":""} ${isMv?"mv":""} ${mc.some(c=>c[0]===x&&c[1]===y)?"mc":""} ${sk&&(sk.k==="a"||sk.k==="o")?"am":""} ${cl} ${zc} ${p&&p.id===sel?"sel":""}" data-x="${x}" data-y="${y}">${inner}</div>`;
  }
  let panel=`<div class="mu" style="text-align:center;margin-top:30%">แตะตัวหมากของคุณ<br>เพื่อดูข้อมูลและสกิล</div>`;
  if(u&&u.team===meTeam){
    const d=R[u.k],ic=icons(u),stx=[ic,u.ww>0?"Wind-Walk":"",u.fly>0?ICON("wing")+" บิน":"",u.awk>0?ICON("awaken")+" Awakening "+(u.awk-1)+" เทิร์น":"",u.sz>0?ICON("overload")+" Super Zone เหลืออีก "+(u.sz-1)+" เทิร์น":"",d.pf&&!(u.fly>0)?"ลงพื้น (โดนระยะไกลไม่ได้)":"",u.aura?"ออร่าเหลือ "+u.aura+" ครั้ง":""].filter(Boolean).join(" ");
    let skills="";
    if(u.st.silent>0)skills=`<div class="ps" style="font-size:1.1em;text-align:center">${ICON("silent")} ถูกใบ้</div>`;
    else skills=d.s.map((s0,i)=>{const sk0=eff(u,i);return `<button class="sk ${mode===i?"on":""}" data-s="${i}" ${usable(u,i)?"":"disabled"}><span class="i">${ICON(sk0.i)}</span><span><b>${sk0.n}</b><small>${u.cd[i]>0?"cooldown "+u.cd[i]:info(sk0)}</small>${sk0.x&&u.cd[i]<1?`<small>${sk0.x}</small>`:""}${sk0.tags?`<small class="tg">${sk0.tags.map(g=>TAGN[g]||g).join(" · ")}</small>`:""}</span></button>`}).join("");
    panel=`<div class="por">${shape(u.k,0)}<div><div class="nm">${d.n}</div><small class="mu">${RAR[d.rar]} · Pop ${d.pop}</small></div></div>
    <div class="hp">${ICON("heart")}<div class="bar" style="flex:1"><i style="width:${u.hp/d.hp*100}%"></i></div><b>${u.hp}/${d.hp}</b></div>
    ${u.sh?`<div class="ps">${ICON("shield")} โล่ ${u.sh}</div>`:""}${stx?`<div class="ps">สถานะ: ${stx}</div>`:""}
    ${dis(u)?`<div class="ps">ใช้ตัวนี้ไม่ได้ในตานี้</div>`:""}
    ${d.pas?`<div class="ps">✦ ${d.pas}</div>`:""}<hr>${skills}
    <div class="mu" style="font-size:.8em">แตะช่องฟ้าเพื่อเดิน (หัก MP 1) · ใช้สกิลหัก AP 1</div>`;
  }else if(u&&!hidden(u)){
    panel=`<div class="por">${shape(u.k,1)}<div class="nm">${R[u.k].n}</div></div><hr><div class="mu" style="text-align:center">ข้อมูลของฝ่ายตรงข้าม</div>`;
  }
  if(over>=0)lastTurnSeen=-1;
  else if(turn!==lastTurnSeen){
    lastTurnSeen=turn;turnDeadline=Date.now()+TURN_SECONDS*1000;
    if(turn===meTeam)showBanner("ถึงตาของคุณแล้ว!");
  }
  const turnLabel=over>=0?"จบเกม":turn===meTeam?"ตาของคุณ":"ตาฝ่ายตรงข้าม";
  const leftNow=Math.max(0,Math.ceil((turnDeadline-Date.now())/1000));
  const endBtns=onlineGame
    ?`<button class="m" id="again" ${onlineRematchSent?"disabled":""}>${onlineRematchSent?"รออีกฝ่ายตอบรับ...":onlineRematchOpp?"อีกฝ่ายขอเล่นอีกครั้ง · กดเพื่อรับ":"เล่นอีกครั้ง"}</button><button class="m" id="leave" style="background:var(--sf2);color:var(--tx)">ออกจากห้อง</button>`
    :`<button class="m" id="again">กลับหน้าเลือกตัวละคร</button>`;
  $("g").innerHTML=`<div class="col left"><div class="mu">ฝ่ายคุณ</div>${rows(me)}<hr><div class="mu">ฝ่ายตรงข้าม</div>${rows(en)}</div>
  <div class="mid"><div class="top"><b>${turnLabel}</b><span>MP ${P[turn].mp}/2 · AP ${P[turn].ap}/2</span><span class="tt ${leftNow<=10?"low":""}" id="tt">${over>=0||(!onlineGame&&turn===1)?"":leftNow+" วิ"}</span><span class="msg">${esc(msg)}</span><button class="m" id="et" ${turn!==meTeam||over>=0?"disabled":""}>จบเทิร์น</button></div>
  <div class="bw"><div class="bwrap"><div class="board" id="bd">${cells}</div>${ambHTML()}${WCELLS.length?'<div class="wisps"><i class="wp" id="wp0"></i><i class="wp" id="wp1"></i></div>':""}<div class="fxl">${vxHTML()}${fxHTML()}</div>${over>=0?`<div class="ov"><div style="font-size:2.2em">${over===meTeam?ICON("trophy")+" คุณชนะ!":ICON("skull")+" ฝ่ายตรงข้ามชนะ"}</div>${endBtns}</div>`:""}</div></div></div>
  <div class="col right">${panel}</div>`;
  $("g").querySelectorAll("[data-r]").forEach(r=>r.onclick=()=>choose(+r.dataset.r));
  $("g").querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{
    const si=+b.dataset.s,ss=eff(u,si);
    if(["s","w","f","v","x"].includes(ss.k)){cast(u,si);mode=-1;render();broadcastGameState();}else mode=mode===si?-1:si;
    render();
  });
  $("bd").onclick=e=>{const c=e.target.closest(".cell");if(c)cellClick(+c.dataset.x,+c.dataset.y)};
  $("et").onclick=()=>{if(turn===meTeam&&over<0)begin(1-meTeam)};
  const ag=$("again");if(ag)ag.onclick=()=>{
    if(onlineGame){if(onlineRematchSent||!onlineSocket?.connected)return;onlineRematchSent=true;onlineSocket.emit("request_rematch",{roomCode:onlineRoom});render();}
    else{pick=[];setup();}
  };
  const lv=$("leave");if(lv)lv.onclick=()=>{if(onlineSocket?.connected)onlineSocket.emit("leave_room");backToLobby("ออกจากห้องแล้ว",false);};
}

function choose(id){sel=id;mode=-1;render()}
function cellClick(x,y){
  if(over>=0||turn!==(onlineGame?onlineMyTeam:0))return;
  const u=sel?byId(sel):null,p0=at(x,y),p=p0&&!hidden(p0)?p0:null,meTeam=onlineGame?onlineMyTeam:0;
  if(u&&u.team===meTeam){
    if(mode>=0){
      const s=eff(u,mode);
      if(usable(u,mode)){
        const ok=s.k==="a"||s.k==="o"||(["m","j"].includes(s.k)&&mcells(u,s).some(c=>c[0]===x&&c[1]===y))||(s.k==="q"&&lineCells(u,s).some(c=>c[0]===x&&c[1]===y))||(["n","N","z","c"].includes(s.k)&&cellsFor(u,s).some(c=>c[0]===x&&c[1]===y))||(p&&targetsFor(u,mode).includes(p));
        if(ok){cast(u,mode,x,y);mode=-1;render();broadcastGameState();return}
      }
    }else if(moves(u).some(m=>m[0]===x&&m[1]===y)){enter(u,x,y);P[meTeam].mp--;render();broadcastGameState();return}
  }
  if(p)return choose(p.id);
  sel=null;mode=-1;render();
}

/* ---------- bot ---------- */
function bot(){
  (function step(){
    if(over>=0)return;
    if(!botAct())return begin(0);
    render();setTimeout(step,750);
  })();
}
function botAct(){
  const mine=U.filter(u=>u.team===1),foes=U.filter(u=>u.team===0&&targetable(u));
  if(!mine.length||!U.some(u=>u.team===0))return false;
  const p=P[1];
  if(p.ap>0){
    let best=null;
    const cand=(u,si,x,y,sc)=>{if(!best||sc>best.sc)best={u,si,x,y,sc}};
    mine.forEach(u=>R[u.k].s.forEach((s0,si)=>{
      if(!usable(u,si))return;
      const s=eff(u,si);
      if(s.k==="t")targetsFor(u,si).forEach(t=>cand(u,si,t.x,t.y,s.d+(t.hp<=s.d?20:0)+(s.chain?3:0)));
      else if(s.k==="a"){
        for(let x=0;x<10;x++)for(let y=0;y<10;y++){
          let sc=0;
          CR.forEach(d=>{const t=at(x+d[0],y+d[1]);if(t&&!(t.team===0&&t.ww>0))sc+=t.team===0?s.d+(t.hp<=s.d?15:0):-s.d-5});
          if(sc>5)cand(u,si,x,y,sc);
        }
      }else if(s.k==="s"){const n=foes.filter(e=>dist(u,e)===1).length;if(n)cand(u,si,0,0,s.d*n+3)}
      else if(s.k==="L")targetsFor(u,si).forEach(t=>cand(u,si,t.x,t.y,s.d+(t.hp<=s.d?20:0)+2));
      else if(s.k==="q")ADJ.forEach(d=>{
        let sc=0;
        for(let i=1;i<=s.r;i++){const t=at(u.x+d[0]*i,u.y+d[1]*i);if(t&&t.team===0&&!(t.ww>0)&&canHit(s,t))sc+=s.d+(t.hp<=s.d?15:0)}
        if(sc>0)cand(u,si,u.x+d[0],u.y+d[1],sc);
      });
      else if(s.k==="v"){if(foes.some(e=>dist(u,e)<=3))cand(u,si,0,0,4)}
      else if(s.k==="o"){
        for(let x=0;x<10;x++)for(let y=0;y<10;y++){
          const n=foes.filter(e=>Math.max(Math.abs(e.x-x),Math.abs(e.y-y))<=2&&canHit(s,e)).length;
          if(n>=2)cand(u,si,x,y,n*4);
        }
      }
      else if(s.k==="j")mcells(u,s).forEach(c=>{let sc=0;ADJ.forEach(d=>{const t=at(c[0]+d[0],c[1]+d[1]);if(t&&t.team===0&&!(t.fly>0))sc+=s.d});if(sc>0)cand(u,si,c[0],c[1],sc)});
      else if(s.k==="h")targetsFor(u,si).forEach(t=>{const miss=R[t.k].hp-t.hp;if(miss>=4)cand(u,si,t.x,t.y,Math.min(s.heal,miss)+(t.hp<R[t.k].hp/2?4:0))});
      else if(s.k==="r")targetsFor(u,si).forEach(t=>{if(R[t.k].hp-t.hp>=10)cand(u,si,t.x,t.y,7)});
      else if(s.k==="p")targetsFor(u,si).forEach(t=>{if(t.team===0)cand(u,si,t.x,t.y,3+t.st.poison)});
      else if(s.k==="n")cellsFor(u,s).forEach(c=>{let sc=0;const nr=e=>Math.max(Math.abs(e.x-c[0]),Math.abs(e.y-c[1]))<=1;foes.forEach(e=>{if(nr(e))sc+=4});mine.forEach(a=>{if(nr(a)&&R[a.k].hp-a.hp>=2)sc+=2});if(sc>=4)cand(u,si,c[0],c[1],sc)});
      else if(s.k==="N")cellsFor(u,s).forEach(c=>{const n=foes.filter(e=>Math.max(Math.abs(e.x-c[0]),Math.abs(e.y-c[1]))<=3&&canHit(STRIKE,e)).length;if(n)cand(u,si,c[0],c[1],6+n*2)});
      else if(s.k==="z"){let b=null;cellsFor(u,s).forEach(c=>{const g=foes.length?Math.min(...foes.map(e=>Math.hypot(e.x-c[0],e.y-c[1]))):9;if(!b||g<b.g)b={c,g}});if(b)cand(u,si,b.c[0],b.c[1],1)}
      else if(s.k==="x"){if(foes.some(e=>dist(u,e)<=5))cand(u,si,0,0,5)}
    }));
    if(best){cast(best.u,best.si,best.x,best.y);return true}
  }
  if(p.mp>0&&foes.length){
    let b=null;
    const nd=(x,y)=>Math.min(...foes.map(e=>Math.hypot(e.x-x,e.y-y)));
    mine.forEach(u=>{const cur=nd(u.x,u.y);moves(u).forEach(m=>{const g=cur-nd(m[0],m[1]);if(g>0.01&&(!b||g>b.g))b={u,m,g}})});
    if(b){enter(b.u,b.m[0],b.m[1]);P[1].mp--;return true}
  }
  return false;
}

/* ---------- ONLINE LOBBY ---------- */
let onlineSocket = null;
let onlineRoom = null;
let onlinePlayer = 0;
let onlineReady = false;
let onlineStarted = false;
let onlineGame = false;
let onlineMyTeam = 0;
let onlinePicks = [[], []];
let onlineSubmitted = false;
let onlineRematchSent = false;
let onlineRematchOpp = false;
let onlineEverConnected = false;
let applyingRemoteState = false;

function lobbyStatus(text){
  const el=document.getElementById("lobbyStatus");
  if(el) el.textContent=text;
}
function showLobbyRoom(data){
  onlineRoom=data.roomCode;
  onlinePlayer=data.playerNumber;
  document.getElementById("lobbyHome").hidden=true;
  document.getElementById("lobbyRoom").hidden=false;
  document.getElementById("roomCodeDisplay").textContent=onlineRoom;
  updateLobbyPlayers(data.players || []);
}
// players = [slot1, slot2]; an empty slot is null. Also keeps the Ready button in sync with what the server knows.
function updateLobbyPlayers(players){
  const p1=players[0],p2=players[1];
  const label=p=>p?(p.ready?"พร้อม":"ยังไม่พร้อม"):"รอผู้เล่น";
  document.getElementById("p1State").textContent=label(p1);
  document.getElementById("p2State").textContent=label(p2);
  const mine=players[onlinePlayer-1];
  onlineReady=!!(mine&&mine.ready);
  const both=!!(p1&&p2),btn=document.getElementById("readyBtn");
  btn.disabled=!both||onlineReady;
  btn.textContent=!both?"รอผู้เล่นอีกฝ่าย":(p1.ready&&p2.ready)?"ทั้งสองฝ่ายพร้อม":onlineReady?"กำลังรออีกฝ่าย...":"พร้อม";
}
// Leave the board / pick screens and show the lobby again (inRoom=true keeps the room code on screen).
function backToLobby(message,inRoom){
  onlineStarted=false;onlineGame=false;onlineSubmitted=false;onlineRematchSent=false;onlineRematchOpp=false;onlineReady=false;
  stopDeploy();
  U=[];over=-1;FX=[];fxOut=[];CZ={pc:[],rz:[]};sel=null;mode=-1;msg="";pick=[];
  $("g").innerHTML="";$("su").style.display="none";
  $("onlineLobby").style.display="flex";
  if(!inRoom){onlineRoom=null;onlinePlayer=0}
  $("lobbyHome").hidden=inRoom;
  $("lobbyRoom").hidden=!inRoom;
  lobbyStatus(message);
}
function returnToBoardArena(){
  if(onlineStarted)return;
  onlineStarted=true;onlineGame=true;onlineMyTeam=onlinePlayer-1;pick=[];onlineSubmitted=false;onlineRematchSent=false;onlineRematchOpp=false;
  const lobby=document.getElementById("onlineLobby");
  if(lobby)lobby.style.display="none";
  setup();
}
// Sends the current snapshot plus the visual effects produced since the last snapshot.
function broadcastGameState(){
  if(!onlineGame||applyingRemoteState||!onlineSocket?.connected||!onlineRoom)return;
  onlineSocket.emit("game_state",{roomCode:onlineRoom,state:{U,P,turn,over,nid,msg,VX,CZ,fx:fxOut}});
  fxOut=[];
}
function startOnlineGame(data){
  onlineGame=true;onlinePicks=data.picks;onlineMyTeam=onlinePlayer-1;U=[];over=-1;nid=1;msg="เกมเริ่มแล้ว";FX=[];fxOut=[];VX=[];CZ={pc:[],rz:[]};sel=null;mode=-1;
  onlineRematchSent=false;onlineRematchOpp=false;
  stopDeploy();
  setArena(Number.isInteger(data.theme)?data.theme:0);resetTurnClock();msg="เกมเริ่มแล้ว · สนาม: "+ARENA[arena].n;
  for(let team=0;team<2;team++){
    const lay=data.layouts&&data.layouts[team];
    if(lay)lay.forEach(l=>U.push(mk(l.k,team,l.x,l.y)));
    else{const chosen=data.picks[team]||[],coords=spread(chosen.length);chosen.forEach((k,i)=>U.push(mk(k,team,coords[i],team===0?9:0)))}
  }
  $("su").style.display="none";
  // Both clients build the identical opening position, so neither needs to send it to the other.
  applyingRemoteState=true;
  try{begin(data.firstTurn===0?0:1)}finally{applyingRemoteState=false}
}
function connectOnlineLobby(){
  if(typeof io!=="function"){
    lobbyStatus("โหลด Socket.IO ไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ");
    return;
  }
  onlineSocket=io();
  onlineSocket.on("connect",()=>{
    if(onlineEverConnected&&onlineRoom){
      // The server drops a player's room when the connection breaks, so the old room no longer exists.
      backToLobby("การเชื่อมต่อหลุด ห้องเดิมถูกปิดแล้ว กรุณาสร้างห้องใหม่หรือเข้าร่วมอีกครั้ง",false);
    }else lobbyStatus("เชื่อมต่อเซิร์ฟเวอร์แล้ว");
    onlineEverConnected=true;
  });
  onlineSocket.on("connect_error",()=>lobbyStatus("เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ลองรีเฟรชอีกครั้ง"));
  onlineSocket.on("room_created",data=>{
    showLobbyRoom(data);
    lobbyStatus("สร้างห้องสำเร็จ ส่งรหัสนี้ให้อีกฝ่ายได้เลย");
  });
  onlineSocket.on("room_joined",data=>{
    showLobbyRoom(data);
    lobbyStatus("เข้าห้องสำเร็จ");
  });
  onlineSocket.on("room_update",data=>{
    const ps=data.players||[];
    updateLobbyPlayers(ps);
    if(onlineStarted)return;
    const both=ps.length===2&&ps.every(p=>p);
    if(both&&ps.every(p=>p.ready)){
      lobbyStatus("ผู้เล่นทั้งสองฝ่ายพร้อมแล้ว! กำลังกลับเข้าสู่ Zhess X...");
      setTimeout(returnToBoardArena,700);
    }else{
      lobbyStatus(both?"รอผู้เล่นทั้งสองฝ่ายกดพร้อม...":"รอผู้เล่นอีกฝ่ายเข้าห้อง...");
    }
  });
  onlineSocket.on("deploy_start",data=>{
    lobbyStatus("เริ่มวางตัว!");
    deployStart(data.picks[onlineMyTeam]||[],onlineMyTeam,data.seconds||DEPLOY_SECONDS,layout=>{
      onlineSocket.emit("submit_deploy",{roomCode:onlineRoom,layout});
    });
  });
  onlineSocket.on("deploy_opponent_ready",()=>{if(DEP){DEP.oppReady=true;depDraw()}});
  onlineSocket.on("deploy_error",data=>{if(DEP){DEP.submitted=false;DEP.err=(data&&data.message)||"วางตัวไม่ถูกต้อง";depDraw()}});
  onlineSocket.on("game_start",data=>{lobbyStatus("เริ่มการแข่งขัน!");startOnlineGame(data);});
  onlineSocket.on("game_state",data=>{
    if(!onlineGame||!data?.state)return;
    applyingRemoteState=true;
    try{
      const st=data.state;
      U=st.U;P=st.P;turn=st.turn;over=st.over;nid=st.nid;VX=st.VX||[];CZ=st.CZ||{pc:[],rz:[]};msg=st.msg||"";sel=null;mode=-1;
      (st.fx||[]).forEach(f=>addFx(f));
      render();
    }finally{applyingRemoteState=false}
  });
  onlineSocket.on("rematch_requested",()=>{onlineRematchOpp=true;if(over>=0)render();});
  onlineSocket.on("rematch_start",()=>{
    stopDeploy();
    U=[];over=-1;FX=[];fxOut=[];CZ={pc:[],rz:[]};sel=null;mode=-1;msg="";pick=[];
    onlineSubmitted=false;onlineRematchSent=false;onlineRematchOpp=false;
    $("g").innerHTML="";
    setup();
  });
  onlineSocket.on("room_error",data=>{
    const text=data.message||"เกิดข้อผิดพลาด";
    if(onlineStarted&&onlineSubmitted&&!U.length){onlineSubmitted=false;setup();$("pickWait").textContent=text;}
    else lobbyStatus(text);
  });
  onlineSocket.on("player_left",()=>{
    if(onlineStarted)backToLobby("ผู้เล่นอีกฝ่ายออกจากห้อง กลับมารอที่ล็อบบี้ ส่งรหัสห้องให้คนใหม่ได้เลย",true);
    else lobbyStatus("ผู้เล่นอีกฝ่ายออกจากห้องแล้ว");
  });
  onlineSocket.on("disconnect",()=>lobbyStatus("การเชื่อมต่อขาดหาย กำลังเชื่อมต่อใหม่..."));
}
document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("botBtn").onclick=()=>{
    onlineGame=false;onlineStarted=false;pick=[];U=[];over=-1;
    document.getElementById("onlineLobby").style.display="none";
    setup();
  };
  try{connectOnlineLobby()}catch(e){lobbyStatus("ออฟไลน์ · เล่นกับบอทได้")}
  document.getElementById("createRoomBtn").onclick=()=>{
    if(onlineSocket?.connected) onlineSocket.emit("create_room");
    else lobbyStatus("ยังไม่ได้เชื่อมต่อเซิร์ฟเวอร์");
  };
  document.getElementById("joinRoomBtn").onclick=()=>{
    const code=document.getElementById("roomCodeInput").value.trim().toUpperCase();
    if(code.length!==6){lobbyStatus("กรุณากรอกรหัสห้อง 6 ตัว");return;}
    if(onlineSocket?.connected) onlineSocket.emit("join_room",{roomCode:code});
    else lobbyStatus("ยังไม่ได้เชื่อมต่อเซิร์ฟเวอร์");
  };
  document.getElementById("readyBtn").onclick=()=>{
    if(!onlineRoom||!onlineSocket?.connected)return;
    onlineSocket.emit("set_ready",{roomCode:onlineRoom});
    lobbyStatus("ส่งสถานะพร้อมแล้ว");
  };
  document.getElementById("leaveRoomBtn").onclick=()=>{
    if(onlineSocket?.connected) onlineSocket.emit("leave_room");
    backToLobby("ออกจากห้องแล้ว",false);
  };
});

</script>
